<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>종목 스캐너</title>
<style>
  :root{
    --bg:#0b0e14; --card:#151a24; --card2:#1b2230; --border:#252c3a;
    --text:#e8ecf3; --sub:#8a93a6; --accent:#4f8cff; --up:#ff5b5b; --down:#4a90ff;
    --good:#3ddc97; --warn:#ffb84f;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif;
    padding-bottom:calc(90px + env(safe-area-inset-bottom));}
  header{position:sticky; top:0; z-index:10; background:rgba(11,14,20,0.92); backdrop-filter:blur(10px);
    padding:calc(env(safe-area-inset-top) + 14px) 16px 10px; border-bottom:1px solid var(--border);}
  h1{font-size:17px; margin:0 0 10px; font-weight:700;}
  .tabs{display:flex; gap:8px;}
  .tab{flex:1; text-align:center; padding:10px 0; border-radius:10px; background:var(--card2);
    color:var(--sub); font-size:14px; font-weight:600; border:1px solid var(--border);}
  .tab.active{background:var(--accent); color:#fff; border-color:var(--accent);}
  main{padding:14px 16px;}
  .meta{font-size:12px; color:var(--sub); margin-bottom:12px; display:flex; justify-content:space-between;}
  .disclaimer{font-size:11.5px; color:var(--warn); background:rgba(255,184,79,0.08);
    border:1px solid rgba(255,184,79,0.25); border-radius:10px; padding:10px 12px; margin-bottom:14px; line-height:1.5;}
  .regime-row{display:flex; gap:8px; margin-bottom:12px;}
  .regime-badge{flex:1; padding:8px 10px; border-radius:10px; font-size:12px; text-align:center; font-weight:600; border:1px solid var(--border);}
  .regime-badge.bull{background:rgba(61,220,151,0.1); color:var(--good); border-color:rgba(61,220,151,0.3);}
  .regime-badge.bear{background:rgba(255,91,91,0.1); color:var(--up); border-color:rgba(255,91,91,0.3);}
  .card{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px; margin-bottom:12px;}
  .card-top{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px;}
  .name{font-size:16px; font-weight:700;}
  .code{font-size:12px; color:var(--sub); margin-top:2px;}
  .badge{font-size:11px; padding:3px 8px; border-radius:20px; background:var(--card2); color:var(--sub); margin-left:6px;}
  .score{font-size:20px; font-weight:800; color:var(--good); text-align:right;}
  .score-label{font-size:10px; color:var(--sub); text-align:right;}
  .grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:10px;}
  .cell{background:var(--card2); border-radius:10px; padding:8px; text-align:center;}
  .cell .l{font-size:10.5px; color:var(--sub); margin-bottom:3px;}
  .cell .v{font-size:14px; font-weight:700;}
  .v.entry{color:var(--text);}
  .v.target{color:var(--up);}
  .v.stop{color:var(--down);}
  .subrow{display:flex; justify-content:space-between; margin-top:10px; font-size:12px; color:var(--sub);}
  .subrow b{color:var(--text); font-weight:600;}
  .empty{text-align:center; color:var(--sub); padding:60px 20px; font-size:14px; line-height:1.7;}
  .refresh{position:fixed; bottom:calc(24px + env(safe-area-inset-bottom)); right:20px; background:var(--accent); color:#fff; border:none;
    width:52px; height:52px; border-radius:26px; font-size:20px; box-shadow:0 4px 14px rgba(79,140,255,0.4); z-index:50;
    display:flex; align-items:center; justify-content:center; -webkit-user-select:none; user-select:none;}
  .refresh:active{opacity:0.7;}
</style>
</head>
<body>
<header>
  <h1>📈 스윙 · 단타 스캐너</h1>
  <div class="tabs">
    <div class="tab active" id="tab-swing" onclick="showTab('swing')">스윙 (3주 이내)</div>
    <div class="tab" id="tab-day" onclick="showTab('day')">단타 (당일)</div>
  </div>
</header>
<main>
  <div id="panel-swing"></div>
  <div id="panel-day" style="display:none;"></div>
</main>
<button class="refresh" onclick="loadAll()">⟳</button>

<script>
const dataUrls = {
  swing: './data/swing_results.json',
  day: './data/daytrade_results.json'
};

function fmtNum(n){ return n === null || n === undefined ? '-' : Number(n).toLocaleString('ko-KR'); }
function fmtTime(iso){
  if(!iso) return '-';
  const d = new Date(iso);
  return d.toLocaleString('ko-KR', {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'});
}

function swingCard(r){
  return `
  <div class="card">
    <div class="card-top">
      <div>
        <div class="name">${r.name} <span class="badge">${r.market}</span></div>
        <div class="code">${r.code} · 현재가 ${fmtNum(r.close)}원</div>
      </div>
      <div>
        <div class="score">${r.score}</div>
        <div class="score-label">신호점수</div>
      </div>
    </div>
    <div class="grid">
      <div class="cell"><div class="l">매수가(참고)</div><div class="v entry">${fmtNum(r.entry_price)}</div></div>
      <div class="cell"><div class="l">목표가</div><div class="v target">${fmtNum(r.target_price)}</div></div>
      <div class="cell"><div class="l">손절가(-3%)</div><div class="v stop">${fmtNum(r.stop_loss_price_fixed3pct)}</div></div>
    </div>
    <div class="subrow">
      <span>예상수익률 <b>+${r.expected_return_pct}%</b></span>
      <span>예상 보유기간 <b>${r.holding_period}</b></span>
    </div>
    <div class="subrow">
      <span>RSI ${r.rsi14} · ADX ${r.adx14}</span>
      <span>거래량비 ${r.vol_ratio20}배</span>
    </div>
  </div>`;
}

function dayCard(r){
  return `
  <div class="card">
    <div class="card-top">
      <div>
        <div class="name">${r.name}</div>
        <div class="code">${r.code} · 현재가 ${fmtNum(r.current_price)}원 (${r.change_rate_pct > 0 ? '+' : ''}${r.change_rate_pct}%)</div>
      </div>
      <div>
        <div class="score">${r.score}</div>
        <div class="score-label">신호점수</div>
      </div>
    </div>
    <div class="grid">
      <div class="cell"><div class="l">매수 구간</div><div class="v entry">${fmtNum(r.entry_price_range[0])}~${fmtNum(r.entry_price_range[1])}</div></div>
      <div class="cell"><div class="l">목표가</div><div class="v target">${fmtNum(r.target_price)}</div></div>
      <div class="cell"><div class="l">손절가</div><div class="v stop">${fmtNum(r.stop_loss_price)}</div></div>
    </div>
    <div class="subrow">
      <span>예상수익률 <b>+${r.expected_return_pct}%</b></span>
      <span>${r.expected_timing}</span>
    </div>
    <div class="subrow">
      <span>${r.in_volume_rank ? '✅ 거래량상위' : ''} ${r.in_investor_rank ? '✅ 수급상위' : ''}</span>
    </div>
  </div>`;
}

function regimeRow(regime){
  if(!regime) return '';
  const badges = Object.entries(regime).map(([market, info]) => {
    const cls = info.bullish ? 'bull' : 'bear';
    const label = info.bullish ? '상승장' : '하락장(신호 제외)';
    return `<div class="regime-badge ${cls}">${market} ${label}</div>`;
  }).join('');
  return `<div class="regime-row">${badges}</div>`;
}

async function loadAll(){
  await loadPanel('swing');
  await loadPanel('day');
}

async function loadPanel(kind){
  const panel = document.getElementById(kind === 'swing' ? 'panel-swing' : 'panel-day');
  try{
    const res = await fetch(dataUrls[kind] + '?t=' + Date.now());
    const data = await res.json();
    const items = kind === 'swing' ? (data.results || []) : (data.candidates || []);
    let html = '';
    html += `<div class="meta"><span>업데이트: ${fmtTime(data.generated_at)}</span><span>${items.length}건</span></div>`;
    if(kind === 'swing'){ html += regimeRow(data.market_regime); }
    html += `<div class="disclaimer">⚠️ ${data.disclaimer || '본 결과는 알고리즘 산출값이며 투자 조언이 아닙니다.'}</div>`;
    if(items.length === 0){
      html += `<div class="empty">아직 신호가 없거나<br>스캔이 실행되기 전입니다.<br>GitHub Actions 실행 로그를 확인하세요.</div>`;
    } else {
      html += items.map(kind === 'swing' ? swingCard : dayCard).join('');
    }
    panel.innerHTML = html;
  } catch(e){
    panel.innerHTML = `<div class="empty">데이터를 불러오지 못했습니다.<br>${e}</div>`;
  }
}

function showTab(kind){
  document.getElementById('tab-swing').classList.toggle('active', kind === 'swing');
  document.getElementById('tab-day').classList.toggle('active', kind === 'day');
  document.getElementById('panel-swing').style.display = kind === 'swing' ? 'block' : 'none';
  document.getElementById('panel-day').style.display = kind === 'day' ? 'block' : 'none';
}

loadAll();
</script>
</body>
</html>
