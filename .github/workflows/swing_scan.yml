name: Swing Scan

on:
  schedule:
    # 매일 15:45 KST (= 06:45 UTC) 평일 실행. 필요시 시간 조정하세요.
    - cron: "45 6 * * 1-5"
  workflow_dispatch: {}  # 수동 실행 버튼

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run swing scan
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python -m scanner.run_swing

      - name: Commit updated results
        run: |
          git config user.name "swing-scan-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/swing_results.json
          git diff --cached --quiet || git commit -m "chore: update swing scan results [skip ci]"
          git push
