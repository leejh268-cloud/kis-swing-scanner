name: Daytrade Scan

on:
  # ⚠️ 자동 스케줄(cron)은 비활성화했습니다. 한투 API가 GitHub Actions의 서버 IP를
  # 차단하는 것으로 확인되어(403 Forbidden), 이 워크플로는 현재 사용하지 않습니다.
  # 대신 로컬 PC + Windows 작업 스케줄러로 대체했습니다.
  workflow_dispatch: {}  # 수동 실행 버튼 (디버깅용으로만 남겨둠)

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daytrade scan
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python -m scanner.run_daytrade

      - name: Commit updated results
        run: |
          git config user.name "daytrade-scan-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/daytrade_results.json
          git diff --cached --quiet || git commit -m "chore: update daytrade scan results [skip ci]"
          git push
